<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>

    <link rel="stylesheet" href="./dist/output.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="bg-black">

<!-- Hero Section -->
<div class="bg-[url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba')] bg-cover bg-center h-screen">

    <!-- Dark Overlay -->
    <div class="bg-black/70 h-full">

        <!-- Navbar -->
        <nav class="flex justify-between items-center px-14 py-6">

            <h1 class="text-red-600 text-5xl font-bold">
                NETFLIX
            </h1>

            <div class="flex gap-5">

                <button class="border border-white text-white px-4 py-2 rounded">
                    English
                </button>

                <button class="bg-red-600 text-white px-5 py-2 rounded hover:bg-red-700">
                    Sign In
                </button>

            </div>

        </nav>

        <!-- Hero Content -->
        <div class="flex flex-col justify-center items-center text-center h-[80vh] text-white">

            <h1 class="text-6xl font-bold w-3/4">
                Unlimited Movies, TV Shows and More
            </h1>

            <p class="text-2xl mt-6">
                Watch anywhere. Cancel anytime.
            </p>

            <p class="mt-5">
                Ready to watch? Enter your email to create or restart your membership.
            </p>

            <div class="flex gap-3 mt-8">

                <input
                    type="email"
                    placeholder="Email Address"
                    class="w-96 p-4 rounded bg-black/50 border border-gray-400">

                <button class="bg-red-600 px-8 py-4 rounded text-xl hover:bg-red-700">
                    Get Started >
                </button>

            </div>

        </div>

    </div>

</div>

</body>
</html>
